services:
  workers:
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/worker_management
      POSTGRES_SSLMODE: disable
      SSL_VERIFY: "false"
    depends_on:
      - db
    networks:
      - default

  db:
    image: postgres:18-alpine
    container_name: worker-management-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: worker_management
    ports:
      - "5452:5432"  # choose a free host port for local dev
    volumes:
      - worker_management_db_data:/var/lib/postgresql/data
    networks:
      - default

volumes:
  worker_management_db_data:
